# Does the Wed/Thu/Fri practice report carry anything the game status does not?
#
# `injury_features` has read `report_status` since it was written and ignored
# `practice_status` beside it. On the raw feed the practice column is set on
# 61,175 of 61,221 rows against the game status's 32,055, so 29,163
# player-weeks carry a practice report and no status at all — invisible to the
# model. It also splits a status: "Questionable" covers 3,195 player-weeks who
# practised fully and 2,581 who did not practise at all, and those were the
# same number to every model this project has trained.
#
# Joined onto candidates the coverage is much thinner — about 12% of training
# rows, because only players on a report have a row — so the honest prior is
# that this moves very little. That is what the screen is for.
#
# Run as a REMOVAL: the champion carries the family, this overlay drops it. A
# family that matters makes the overlay worse.
#
#   make screen EXP=experiments/no-practice-report.yaml
#   make gate   EXP=experiments/no-practice-report.yaml
id: 2026.09.22-no-practice-report
note: "Ablate the practice-report family; champion carries it, overlay drops it"
overlay:
  models:
    exclude_feature_families:
    - build_practice_features
