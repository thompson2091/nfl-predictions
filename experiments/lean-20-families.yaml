# Is K=20 a better cut than the K=25 now being served?
#
# The finer retention ladder (2026-08-19) reads every K from 16 to 30 as
# positive against the full 318-column set, with adjacent points differing by
# more than the 0.64pp seed band — so a single seed cannot order them. K=20
# read +1.68pp (p=0.101).
#
# K=25 is settled at +1.64pp over 5 seeds (ahead in 5 of 5). This exists to be
# settled the same way, against the same baseline, before anything moves.
#
#   make settle-overlay EXP=experiments/lean-20-families.yaml SEEDS=5 MARKET=anytime_td
id: 2026.08.19-lean-20-families
note: "anytime TD on the 20 ablation-dearest families (215 of 318 columns)"
overlay:
  models:
    include_feature_families_by_target:
      anytime_td:
      - _build_game_context_features
      - build_box_features
      - build_depth_chart_features
      - build_goalline_features
      - build_injury_features
      - build_matchup_interaction_features
      - build_momentum_features
      - build_opening_drive_features
      - build_personnel_features
      - build_player_redzone_features
      - build_player_rolling_features
      - build_player_share_features
      - build_player_target_history
      - build_qb_features
      - build_receiver_features
      - build_score_first_features
      - build_td_proxy_features
      - build_td_streak_features
      - build_team_features
      - build_team_target_tendency
