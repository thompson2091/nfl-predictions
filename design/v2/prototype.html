.feat__h { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }

      '<button class="btn btn--primary" style="flex:1" data-act="save">Save slip</button></div>';
    h += '</div>';
    if (s.same) h += '<div style="padding:12px 4px;font-size:13px;line-height:18px;color:var(--ink-muted)">Two legs share a fixture. All hit multiplies them as if they were independent, and they are not — treat it as a ceiling.</div>';
    h += '<div style="height:24px"></div></div>';
    return h;
  }
  function countGame(legs, g) { var n = 0; legs.forEach(function (l) { if (l.game === g) n++; }); return n; }

  function vCombos() {
    var c = combos();
    var h = '<div class="chiprow">' +
      chipv("legs", S.comboLegs + " legs") + chipv("rank", S.comboRank === "likely" ? "Most likely" : (S.comboRank === "price" ? "Longest price" : "Expected value")) +
      '<button class="chip" aria-pressed="' + (S.sameGame ? "true" : "false") + '" data-act="samegame">Allow same game</button></div>';
    h += '<div class="sect"><div class="card">';
    if (!c.rows.length) h += empty("No combinations", "Allow same-game slips, or shortlist more players.", null, null);
    h += c.rows.map(function (r, i) {
      return '<div class="combo"><div class="combo__l">' + r.legs.map(function (l) { return esc(l.name); }).join(" &middot; ") + '</div>' +
        '<div class="combo__t">' + r.legs.map(function (l) { return l.team; }).join(", ") +
          (r.same ? ' <span class="badge badge--warn" style="height:18px">Same game</span>' : '') + '</div>' +
        '<div class="combo__f">' +
          m("All hit", pct(r.p), "") + m("Pays", amer(r.dec), "") + m("EV $10", (r.ev >= 0 ? "+" : "") + money(r.ev), r.ev >= 0 ? "v-good" : "v-bad") +
          '<span style="flex:1"></span><button class="btn btn--secondary btn--sm" data-load="' + i + '">Load</button></div></div>';
    }).join("");
    h += '</div><div style="height:12px"></div><div style="font-size:12px;line-height:17px;color:var(--ink-faint);text-align:center">' +
      c.total.toLocaleString("en-US") + ' slips of ' + S.comboLegs + ' from the ' + c.poolN + ' we rate highest &middot; showing the top ' + c.rows.length + '.</div><div style="height:24px"></div></div>';
    return h;
  }
  function chipv(k, label) { return '<button class="chip" aria-pressed="false" data-sheet="' + k + '">' + esc(label) + ' ' + ICON.chev + '</button>'; }

  function vLadder() {
    var rows = ladder(), last = rows[rows.length - 1];
    var h = '<div class="sect"><div class="card" style="padding:16px;display:flex;flex-direction:column;gap:16px">' +
      '<label class="field"><span class="field__l">Starting bankroll</span><span class="field__b"><span class="field__p">$</span>' +
        '<input class="num" id="f-bank" inputmode="decimal" value="' + S.bank + '"></span></label>' +
      '<label class="field"><span class="field__l">Price each rung</span><span class="field__b">' +
        '<input class="num" id="f-price" inputmode="decimal" value="' + S.price + '"></span>' +
        '<span class="field__h">American (−170) or decimal (1.59)</span></label>' +
      '<div class="field"><span class="field__l">Rungs</span><span class="field__b">' +
        '<input class="num" id="f-rungs" inputmode="numeric" value="' + S.rungs + '">' +
        '<span style="display:flex;gap:4px"><button class="ib" style="width:34px;height:34px;border:1px solid var(--border)" data-act="rung-" aria-label="Fewer rungs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>' +
        '<button class="ib" style="width:34px;height:34px;border:1px solid var(--border)" data-act="rung+" aria-label="More rungs">' + ICON.plus.replace('width="22" height="22"','width="18" height="18"') + '</button></span>' +
      '</span><span class="field__h">Up to 50</span></div></div>';
    h += '<div style="height:12px"></div><div class="card"><div class="keystats">' +
      '<div class="keystat"><span class="keystat__l">If every rung wins</span><span class="keystat__v num" style="color:var(--good)">' + money(last.bal) + '</span></div>' +
      '<div class="keystat"><span class="keystat__l">Chance of the run</span><span class="keystat__v keystat__v--sm num">' + pct(last.chance) + '</span></div>' +
      '<div class="keystat"><span class="keystat__l">At risk</span><span class="keystat__v keystat__v--sm num" style="color:var(--bad)">' + money(S.bank) + '</span></div>' +
    '</div></div>';
    h += '<div style="height:12px"></div><div class="card"><div class="secthead"><span>Rung &middot; Balance</span><span>Chance</span></div>';
    var max = rows[0].chance;
    h += rows.map(function (r) {
      return '<div class="rung"><span class="rung__n num">' + r.n + '</span>' +
        '<span class="rung__b num">' + money(r.bal) + '</span>' +
        '<span class="rung__p num">+' + money(r.profit) + '</span>' +
        '<span class="rung__r"><span class="rung__c num">' + pct(r.chance) + '</span>' +
        '<span class="rung__track"><span class="rung__bar" style="width:' + Math.max(2, (r.chance / max) * 100) + '%"></span></span></span></div>';
    }).join("");
    h += '<div class="prose">Every row assumes the one above it won. The branch where it did not is a single row saying zero, and it is the likelier branch from about the third rung on. The chance column is read off the price, so it includes the book’s margin and is therefore kinder than the truth.</div>';
    h += '</div><div style="height:24px"></div></div>';
    return h;
  }

  function vModel() {
    var max = FEATURES[0][1];
    return '<div class="sect"><div class="card"><div class="secthead"><span>What the model uses</span><span>Impact</span></div>' +
      FEATURES.map(function (f) {
        return '<div class="feat"><div class="feat__h"><span class="feat__n">' + f[0] + '</span><span class="feat__v num">' + f[1] + '</span></div>' +
          '<div class="feat__t"><span class="feat__f" style="width:' + (f[1] / max * 100) + '%"></span></div>' +
          '<div class="feat__d">' + f[2] + '</div></div>';
      }).join("") +
      '<div class="prose">Impact is the drop in out-of-sample log loss when the feature is shuffled, scaled so the largest reads 100. It says which inputs the model leans on, not which ones cause a touchdown.</div></div>' +
      '<div style="height:24px"></div></div>';
  }

  /* ------------------------------------------------ sheets */
  var sheetDef = {
    market: function () {
      return sheet("Market", ["Anytime TD", "First TD", "2+ TDs"].map(function (x) {
        return opt(x, S.market === x, x === "2+ TDs" ? "Soon" : "", "market", x, x === "2+ TDs");
      }).join(""));
    },
    pos: function () {
      var opts = ["Any position", "QB", "RB", "TE", "WR"];
      return sheet("Position", opts.map(function (x) {
        var n = x === "Any position" ? pool(P).length : pool(P).filter(function (p) { return p.pos === x; }).length;
        return opt(x, S.pos === x, n, "pos", x);
      }).join(""));
    },
    priced: function () {
      var o = [["all", "Priced and not"], ["priced", "Priced only"], ["unpriced", "No price only"]];
      return sheet("Pricing", o.map(function (x) { return opt(x[1], S.priced === x[0], "", "priced", x[0]); }).join(""));
    },
    game: function () {
      var body = opt("All " + GAMES.length + " games", S.game === "All games", pool(P).length, "game", "All games") +
        GAMES.map(function (g) {
          return opt(g, S.game === g, pool(P).filter(function (p) { return p.game === g; }).length, "game", g);
        }).join("");
      return sheet("Game", body);
    },
    sort: function () {
      return sheet("Sort by", SORTS.map(function (x) { return opt(x[1], S.sort === x[0], "", "sort", x[0]); }).join(""));
    },
    legs: function () {
      return sheet("Legs", [2, 3, 4, 5, 6].map(function (n) { return opt(n + " legs", S.comboLegs === n, "", "legs", n); }).join(""));
    },
    rank: function () {
      var o = [["likely", "Most likely"], ["price", "Longest price"], ["ev", "Expected value"]];
      return sheet("Rank by", o.map(function (x) { return opt(x[1], S.comboRank === x[0], "", "rank", x[0]); }).join(""));
    },
    detail: function (id) {
      var p = P[id], r = read(p), fav = S.favs[p.id], inSlip = S.slip.indexOf(p.id) > -1;
      var body =
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px">' + badge(r) +
          '<span class="badge badge--neutral">' + p.pos + '</span>' +
          (isShort(p) ? '<span class="badge badge--neutral">Shortlisted</span>' : '') +
          (isFade(p) ? '<span class="badge badge--bad">Faded</span>' : '') + '</div>' +
        '<div class="metrics" style="padding-bottom:16px;flex-wrap:wrap;gap:16px">' +
          m("Odds", p.odds === null ? "—" : (p.odds > 0 ? "+" + p.odds : "" + p.odds), p.odds === null ? "v-none" : "") +
          m("Model", pct(p.model), "") +
          m("Book", p.book === null ? "—" : pct(p.book), p.book === null ? "v-none" : "") +
          '<span class="metric metric--ours"><span class="metric__l">Adj</span><span class="metric__v num">' + pct(p.adj) + '</span></span>' +
          m("Edge", p.edge === null ? "—" : signed(p.edge), p.edge === null ? "v-none" : (p.edge >= 0 ? "v-good" : "v-bad")) +
          m("EV $100", p.ev === null ? "—" : (p.ev >= 0 ? "+" : "") + money(p.ev), p.ev === null ? "v-none" : (p.ev >= 0 ? "v-good" : "v-bad")) +
        '</div>' +
        '<div style="font-size:15px;line-height:20px;color:var(--ink-muted)">' + explain(p) + '</div>' +
        '<div style="display:flex;gap:12px;margin-top:20px">' +
          '<button class="btn btn--secondary" style="flex:1" data-act="fav:' + p.id + '">' + (fav ? "Unfavourite" : "Favourite") + '</button>' +
          '<button class="btn btn--primary" style="flex:1" data-act="add:' + p.id + '">' + (inSlip ? "Remove from slip" : "Add to slip") + '</button></div>';
      return sheet(p.name + " · " + p.team, body, p.game);
    }
  };
  function explain(p) {
    if (p.odds === null) return "Nobody has quoted him yet. The model still rates him at " + pct(p.adj) + ", so he is worth watching when a price appears.";
    if (p.edge < 0) return "The book is asking more than the model thinks he is worth. At " + pct(p.book) + " implied against our " + pct(p.adj) + ", the price is the problem, not the player.";
    if (p.edge < 2) return "The model and the market agree within a point. There is nothing here to act on either way.";
    return "The model has him " + signed(p.edge, 1) + " points above the de-vigged price. That gap is where the value is, if the price holds.";
  }
  function sheet(title, body, sub) {
    return '<div class="sheet__grab"></div><div class="sheet__head"><div><div class="sheet__title">' + esc(title) + '</div>' +
      (sub ? '<div style="font-size:13px;color:var(--ink-muted)">' + esc(sub) + '</div>' : '') +
      '</div><button class="btn btn--sm" data-act="closesheet">Done</button></div><div class="sheet__body">' + body + '</div>';
  }
  function opt(label, sel, count, key, val, disabled) {
    return '<button class="opt" aria-selected="' + (sel ? "true" : "false") + '" data-set="' + key + ':' + esc(val) + '"' + (disabled ? " disabled style=\"opacity:.4\"" : "") + '>' +
      '<span>' + esc(label) + '</span>' + (sel ? '<span class="check">✓</span>' : (count !== "" && count !== undefined ? '<span class="c">' + count + '</span>' : '')) + '</button>';
  }

  /* ------------------------------------------------ render */
  var scroll = document.getElementById("scroll"),
      tabbar = document.getElementById("tabbar"),
      slipHost = document.getElementById("slipbarHost"),
      sheetEl = document.getElementById("sheet"),
      scrimEl = document.getElementById("scrim"),
      screenName = document.getElementById("screenName"),
      marketLabel = document.getElementById("marketLabel");

  var TABS = [["board","Board"],["combos","Combos"],["slip","Slip"],["ladder","Ladder"],["model","Model"]];

  function render(keepScroll) {
    var y = scroll.scrollTop;
    marketLabel.textContent = S.market;
    screenName.textContent = S.screen === "board" ? "" : (S.screen === "combos" ? "Combinations" : S.screen.charAt(0).toUpperCase() + S.screen.slice(1));
    scroll.innerHTML = S.screen === "board" ? vBoard()
      : S.screen === "slip" ? vSlip()
      : S.screen === "combos" ? vCombos()
      : S.screen === "ladder" ? vLadder() : vModel();

    var s = slipMath();
    slipHost.innerHTML = (s && S.screen !== "slip")
      ? '<div class="slipbar"><span class="slipbar__count num">' + s.legs.length + '</span>' +
        '<span class="slipbar__main"><span class="slipbar__price num">' + s.price + '</span>' +
        '<span class="slipbar__legs">' + s.legs.map(function (l) { return esc(surname(l.name)); }).join(" · ") + '</span></span>' +
        '<button class="btn btn--primary btn--sm" data-act="openslip">Open</button></div>'
      : "";

    tabbar.innerHTML = TABS.map(function (t) {
      var b = t[0] === "slip" && s ? '<span class="bdg">' + s.legs.length + '</span>' : '';
      return '<button class="tab" data-tab="' + t[0] + '"' + (S.screen === t[0] ? ' aria-current="page"' : '') + '>' +
        '<span class="wrap">' + TABICON[t[0]] + b + '</span>' + t[1] + '</button>';
    }).join("");

    if (keepScroll) scroll.scrollTop = y;
  }

  var openSheet = null;
  function showSheet(kind, arg) {
    openSheet = kind;
    sheetEl.innerHTML = sheetDef[kind](arg);
    scrimEl.classList.add("open");
    sheetEl.classList.add("open");
  }
  function hideSheet() {
    openSheet = null;
    scrimEl.classList.remove("open");
    sheetEl.classList.remove("open");
  }

  /* ------------------------------------------------ events */
  document.getElementById("phone").addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-pool],[data-sheet],[data-act],[data-fav],[data-add],[data-detail],[data-set],[data-load]");
    if (!t) return;
    var d = t.dataset;

    if (d.tab) { S.screen = d.tab; hideSheet(); render(); scroll.scrollTop = 0; return; }
    if (d.pool) { S.pool = d.pool; render(); scroll.scrollTop = 0; return; }
    if (d.sheet) { showSheet(d.sheet); return; }
    if (d.detail) { showSheet("detail", +d.detail); return; }
    if (d.fav !== undefined) { S.favs[d.fav] = !S.favs[d.fav]; render(true); return; }
    if (d.add !== undefined) { toggleSlip(+d.add); render(true); return; }
    if (d.load !== undefined) { S.slip = combos().rows[+d.load].legs.map(function (l) { return l.id; }); S.screen = "slip"; render(); scroll.scrollTop = 0; return; }

    if (d.set) {
      var i = d.set.indexOf(":"), k = d.set.slice(0, i), v = d.set.slice(i + 1);
      if (k === "legs") v = +v;
      if (k === "sort") { if (S.sort === v) S.dir = S.dir === "desc" ? "asc" : "desc"; S.sort = v; }
      else S[k] = v;
      hideSheet(); render(); return;
    }

    var a = d.act;
    if (!a) return;
    if (a.indexOf("fav:") === 0) { var fid = +a.slice(4); S.favs[fid] = !S.favs[fid]; showSheet("detail", fid); render(true); return; }
    if (a.indexOf("add:") === 0) { var aid = +a.slice(4); toggleSlip(aid); showSheet("detail", aid); render(true); return; }
    switch (a) {
      case "closesheet": hideSheet(); break;
      case "dir": S.dir = S.dir === "desc" ? "asc" : "desc"; render(true); break;
      case "favonly": S.favOnly = !S.favOnly; render(true); break;
      case "clearq": S.q = ""; render(); break;
      case "clearfilters": S.pos = "Any position"; S.game = "All games"; S.priced = "all"; S.favOnly = false; render(); break;
      case "clearall": S.q = ""; S.pos = "Any position"; S.game = "All games"; S.priced = "all"; S.favOnly = false; render(); break;
      case "everyone": S.pool = "everyone"; S.screen = "board"; render(); break;
      case "openslip": S.screen = "slip"; render(); scroll.scrollTop = 0; break;
      case "samegame": S.sameGame = !S.sameGame; render(true); break;
      case "ladderthis": var sm = slipMath(); if (sm && sm.price !== "—") { S.price = parseInt(sm.price, 10); } S.screen = "ladder"; render(); scroll.scrollTop = 0; break;
      case "save": var btn = t; btn.textContent = "Saved"; btn.disabled = true; break;
      case "rung+": S.rungs = Math.min(50, S.rungs + 1); render(true); break;
      case "rung-": S.rungs = Math.max(1, S.rungs - 1); render(true); break;
    }
  });

  scrimEl.addEventListener("click", hideSheet);

  scroll.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "q") { S.q = e.target.value; var y = scroll.scrollTop; render(); var f = document.getElementById("q"); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } scroll.scrollTop = y; }
  });
  scroll.addEventListener("change", function (e) {
    var id = e.target.id, v = parseFloat(e.target.value);
    if (id === "f-bank") S.bank = isNaN(v) || v <= 0 ? 100 : v;
    else if (id === "f-price") { if (isNaN(v)) v = -170; if (v > 1 && v < 100) v = Math.round(v >= 2 ? (v - 1) * 100 : -100 / (v - 1)); S.price = Math.abs(v) < 100 ? -110 : Math.round(v); }
    else if (id === "f-rungs") S.rungs = isNaN(v) ? 10 : Math.max(1, Math.min(50, Math.round(v)));
    else return;
    render(true);
  });

  function toggleSlip(id) {
    var i = S.slip.indexOf(id);
    if (i > -1) S.slip.splice(i, 1);
    else if (S.slip.length < 8) S.slip.push(id);
  }

  /* ------------------------------------------------ theme */
  var themeBtn = document.getElementById("themeBtn");
  function prefersDark() { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
  var explicit = null;
  function applyTheme() {
    var dark = explicit === null ? prefersDark() : explicit === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    themeBtn.textContent = dark ? "Light" : "Dark";
  }
  themeBtn.addEventListener("click", function () {
    var dark = explicit === null ? prefersDark() : explicit === "dark";
    explicit = dark ? "light" : "dark";
    applyTheme();
  });
  applyTheme();

  /* ------------------------------------------------ go */
  S.slip = [3, 5, 6];
  render();
})();
</script>

</body></html>
