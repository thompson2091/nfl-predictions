target:
  type: anytime_td          # first_td | anytime_td

seasons:
  start: 2015
  end: 2025
  predict_season: 2026

# Val and test must stay different seasons. Sharing one means the model
# early-stops on it, the temperature scaler is fit on it, ensemble weights are
# optimised on it, and then accuracy is *reported* on it — which inflated every
# number in the app's Model Performance tab.
splits:
  train_end: 2023
  val_season: 2024
  test_season: 2025
rolling_windows:
  short: 3
  medium: 5
models:
  active:
  - lr
  - lgbm
  - xgb
  # Chosen from walk-forward, not from a single season. Pooled over 1,130
  # anytime-TD games (4 retrained folds, none scoring its own training years),
  # re-measured after the week-1 carry-forward fix:
  #   xgb   Top-1 52.1%  AUC 0.8408  Brier 0.09142   <- production
  #   ens   Top-1 50.7%  AUC 0.8411  Brier 0.09131
  #   lgbm  Top-1 49.6%  AUC 0.8369  Brier 0.09191   <- was production
  #   lr    Top-1 49.2%  AUC 0.8250  Brier 0.09299
  # xgb beats lgbm by 2.5 points of Top-1 against a 1.5-point standard error.
  # The ensemble edges it on Brier and AUC but loses 1.4 points of Top-1, and
  # Top-1 is what a card is built on. tests/test_leakage.py asserts this choice
  # against the walk-forward file, so it fails rather than drifts.
  # Re-check with `make walkforward` after any change to features or models.
  production: xgb
  # Per-market override; `production` above is the fallback. First TD and
  # Anytime TD do not want the same model — see production_model() in
  # src/utils/config.py for the walk-forward numbers behind each choice.
  #
  # first_td stays on the ensemble: Top-1 17.1% vs xgb's 17.0% is a tie, but it
  # leads on AUC (0.8216 vs 0.8179) and Brier, and a tie broken toward the more
  # stable estimator is the right way to break it.
  production_by_target:
    anytime_td: xgb
    first_td: ensemble
# Hyperparameters. Every key here reaches the model, and every key the model
# reads is declared here — tests/test_leakage.py asserts both directions
# against DEFAULTS in each wrapper. That check exists because this block used
# to be half-wired: max_depth, subsample and colsample_bytree were read, while
# n_estimators and learning_rate were hardcoded at 2000 and 0.02 in the
# wrappers against the 500 and 0.05 declared here. Tuning those two through
# config changed nothing and raised nothing.
#
# The values are hand-picked and then checked, not searched-and-chosen. A
# 60-configuration walk-forward random search over depth, learning rate, both
# sampling fractions, min_child_weight and both regularisers — scoring seasons
# 2022-2025, each on a model trained only on earlier ones — failed to beat this
# setting by more than its standard error. Re-run
# scripts/19_tune.py before changing anything here.
model:
  seed: 42
  lgbm:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 6
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50
  xgb:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 6
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50
  logistic:
    max_iter: 2000
    C: 0.1
# Market anchoring. Nothing here is a probability — the expected scorer count is
# refit from labels on every training run (src/models/market_prior.py) and the
# blend weight is learned from graded odds history as soon as enough exists
# (src/prediction/blend.py). See docs/DATA_SOURCES.md.
blend:
  enabled: true
  # Used ONLY until odds_history.parquet holds min_history_rows graded
  # player-games. Replaced automatically by the fitted weight thereafter; the
  # prediction output records which one was used in `blend_source`.
  bootstrap_market_weight: 0.5
  min_history_rows: 500
# Bankroll policy — how model probabilities become stakes. These are risk
# preferences, not model constants: they belong to you, not to the data.
betting:
  bankroll: 1000.0
  # Fraction of full Kelly. Full Kelly assumes your probabilities are exact;
  # any overconfidence compounds into ruin, so stake a fraction of it.
  kelly_fraction: 0.25
  # Floors a play must clear. Edge is measured against the DE-VIGGED price.
  min_edge_pp: 2.0
  min_ev_pct: 0.0

paths:
  raw: data/raw
  processed: data/processed
  models: models
  output: output
  plots: output/plots
ai_context:
  enabled: true
  max_adjustment: 0.1
positions:
  offensive:
  - QB
  - RB
  - WR
  - TE
  - FB
