target:
  type: anytime_td          # first_td | anytime_td

seasons:
  start: 2015
  end: 2025
  predict_season: 2026

# Val and test must stay different seasons. Sharing one means the model
# early-stops on it, the temperature scaler is fit on it, ensemble weights are
# optimised on it, and then accuracy is *reported* on it — which inflated every
# number in the app's Model Performance tab.
splits:
  train_end: 2023
  val_season: 2024
  test_season: 2025
rolling_windows:
  short: 3
  medium: 5
models:
  # `condlogit` is registered (src/models/ranker.py) and deliberately NOT active.
  # It was trialled here on 2026-08-13 and reverted the same day; the reason is
  # under production_by_target below, and is worth reading before trying again.
  active:
  - lr
  - lgbm
  - xgb
  # Chosen from walk-forward, not from a single season. Pooled over 1,131
  # anytime-TD games (4 retrained folds, none scoring its own training years),
  # re-measured 2026-08-12 over the corrected denominator — every played game
  # with a scorer in the pool, so a scorer the candidate filter removed counts
  # as a miss rather than vanishing from the count (src/evaluation/ranking.py) —
  # and again after holding DEF/ST out of the offensive share denominator
  # (joint.exclude_defst_from_shares, below). Re-derived 2026-08-14 after
  # removing is_cold, is_windy and season_right — three features that took a
  # single value for every predict-season row (316 features, was 319):
  #   xgb   Top-1 53.8%  Top-3 84.0%  AUC 0.8314  Brier 0.09047   <- production
  #   ens   Top-1 51.6%  Top-3 83.6%  AUC 0.8330  Brier 0.09161
  #   lgbm  Top-1 50.8%  Top-3 83.3%  AUC 0.8291  Brier 0.09153   <- was production
  #   lr    Top-1 49.1%  Top-3 82.9%  AUC 0.8238  Brier 0.09357
  #
  # xgb leads Top-1 by 2.2 points over the ensemble and 3.0 over lgbm, against
  # a 1.5-point unpaired standard error, and leads on Top-3 and Brier too.
  # It was previously kept on a tie, for the reason that the headline
  # strategy backs the top three; the DEF/ST fix turned that tie into a lead,
  # because xgb was the model ranking defences highest and therefore had the
  # most to gain from no longer inflating them.
  #
  # These numbers previously read "xgb Top-1 52.1%, ens 50.7%" and argued xgb
  # led the ensemble by 1.4 points. That was inverted — the artifact said the
  # opposite even then. The choice survived re-derivation; the reason given for
  # it did not. tests/test_leakage.py asserts the choice against the file, so it
  # fails rather than drifts, but no test can check a comment.
  #
  # These are UNPAIRED standard errors and cannot resolve a one-point change.
  # To compare two recipes, use `make gate EXP=...`, which pairs by game.
  # Re-check with `make walkforward` after any change to features or models.
  production: xgb
  # Per-market override; `production` above is the fallback. First TD and
  # Anytime TD do not want the same model — see production_model() in
  # src/utils/config.py for the walk-forward numbers behind each choice.
  #
  # first_td, pooled over 1,131 games, same four folds, re-derived 2026-08-14
  # after the three predict-constant features were removed:
  #   xgb   Top-1 16.5%  Top-3 37.5%  AUC 0.8207  Brier 0.02741   <- production
  #   ens   Top-1 16.8%  Top-3 36.9%  AUC 0.8221  Brier 0.02736   <- was production
  #
  # That table shows the ensemble ahead of xgb, and xgb is still served. The
  # reason is worth reading, because the table is not wrong — it is one draw.
  #
  # Re-settled 2026-08-14 on this 316-feature set, five seeds, each game's
  # outcome averaged before pairing:
  #
  #   Top-1  xgb 16.59%  ->  ensemble 16.43%   -0.16pp (0.41 se), p=0.729
  #   Top-3  37.58% -> 37.15%,  Top-5  53.37% -> 53.17%
  #   ensemble ahead in 2 of 5 seeds; 133 games differ, 64 won and 69 lost
  #
  # So xgb wins on average and on both guards. The walk-forward table above
  # disagrees because it runs at model.seed = 42 alone, and seed 42 is one of
  # the two seeds favouring the ensemble — 16.80% against 16.53%, reproducing
  # the table exactly.
  #
  # Note this is the MIRROR of the {xgb, condlogit} case below. There the
  # average said promote and the served seed said no. Here the served seed says
  # switch and the average says no. They have now disagreed twice out of twice,
  # which is the argument for always reading both: whichever one is checked
  # alone will eventually be the wrong one.
  #
  # Settled 2026-08-12 by the strongest test available, and it changed the
  # answer. Both models were scored on identical folds at five seeds; each
  # game's outcome was averaged across seeds to strip seed noise, then paired
  # across all 1,131 games:
  #
  #   Top-1  ensemble 16.4%  ->  xgb 16.8%   +0.42pp (1.02 se)
  #   Top-3  ensemble 37.7%  ->  xgb 37.8%   +0.16pp (0.35 se)
  #   AUC equal to four decimals; Brier 0.02741 -> 0.02744 (at the noise floor)
  #   xgb ahead in 4 of the 5 seeds; of the 129 games they disagree on,
  #   xgb wins 70 and loses 59.
  #
  # It clears the promotion rule of one paired standard error, but only just,
  # and an 11-game edge over four seasons is the thinnest evidence anything in
  # this project has been changed on. Two tiebreaks pointed the same way: xgb is
  # one model rather than three, and nothing it gives up is above noise.
  #
  # The previous reasoning here — "xgb's lead is 0.7 unpaired standard errors,
  # and switching on a sub-error difference is chasing noise" — used the wrong
  # yardstick. The unpaired binomial error is 1.1 points; the relevant scale is
  # the 0.42-point paired error, because both models rank the same games.
  #
  # Worth knowing before optimising this market at all: rank economics reports
  # NO EDGE DEMONSTRATED here, top 3 at -2.4% [-11.2, +6.7].
  # An {xgb, condlogit} ensemble was trialled on first TD, 2026-08-13, and
  # REVERTED. Recording it because the seed-averaged evidence said take it and
  # the evidence was, on its own terms, not wrong:
  #
  #   seed-averaged over 5 seeds   16.78% -> 17.10%   +0.32pp (1.53 se), p=0.272
  #   the seed we actually serve   16.80% -> 16.62%   -0.18pp
  #
  # `make settle` estimates which RECIPE is better in expectation. We do not
  # serve a recipe, we serve one set of weights, and the pipeline trains at
  # model.seed = 42 — which is the single draw of the five where the ensemble
  # loses. The walk-forward reproduced it to two decimals, so the two paths
  # agree; there is nothing to reconcile, only something to choose.
  #
  # At p=0.272 the recipe's edge is indistinguishable from noise, while the
  # artifact's deficit is directly observable on the same folds. Promoting would
  # also have dropped the board's headline Top-1 from 16.8% to 16.6% while the
  # version manifest called it an improvement.
  #
  # Do not re-run `settle` on this and promote on the average alone. Either
  # check the served seed too, or change what we serve to something a seed
  # average describes — an average over seeds is not a model you can ship.
  production_by_target:
    anytime_td: xgb
    first_td: xgb
# Hyperparameters. Every key here reaches the model, and every key the model
# reads is declared here — tests/test_leakage.py asserts both directions
# against DEFAULTS in each wrapper. That check exists because this block used
# to be half-wired: max_depth, subsample and colsample_bytree were read, while
# n_estimators and learning_rate were hardcoded at 2000 and 0.02 in the
# wrappers against the 500 and 0.05 declared here. Tuning those two through
# config changed nothing and raised nothing.
#
# The values are hand-picked and then checked, not searched-and-chosen. A
# 60-configuration walk-forward random search over depth, learning rate, both
# sampling fractions, min_child_weight and both regularisers — scoring seasons
# 2022-2025, each on a model trained only on earlier ones — failed to beat this
# setting by more than its standard error. Re-run
# scripts/19_tune.py before changing anything here.
model:
  seed: 42
  lgbm:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 6
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50
  xgb:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 6
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50
  logistic:
    max_iter: 2000
    C: 0.1
  # Same tree as `xgb`, different likelihood: the softmax runs within a game for
  # first TD and within a team-game for anytime, so the loss is "which candidate
  # won" rather than "was each candidate's probability calibrated". Held
  # identical to the xgb block on purpose — a difference in Top-1 between them
  # should be attributable to the objective and nothing else.
  condlogit:
    n_estimators: 2000
    learning_rate: 0.02
    max_depth: 6
    min_child_weight: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50
# Unsupervised grouping behind the Player types tab. Nothing here is a cluster
# count: k is fitted per position on the training seasons and persisted with the
# curve that chose it (src/clustering/core.py:choose_k). These are the bounds and
# budgets that fitting runs inside.
#
# The criterion is the GAP STATISTIC, not silhouette, and that is a measured
# choice rather than a stylistic one. On anytime TD, served population, seasons
# <= train_end (75,986 player-games, 20 usage features, standardised):
#
#   k            2     3     4     5     6     7     8
#   silhouette  .465  .483  .355  .366  .304  .299  .292
#
# Silhouette's argmax is k=3 with a sampling error near .003, so a 1-SE rule
# agrees — and those three groups are running backs, receivers, and everyone with
# no usage. The obvious criterion, applied honestly, rediscovers the position
# dummies and calls it a finding. Split-half ARI is .95-.99 at every k and
# separates nothing; GMM BIC falls monotonically to the top of the range.
#
# So position became the stratifier rather than the answer, and selection moved
# to the gap statistic, which is the one standard criterion tested here with an
# interior optimum: WR settles at 4, TE at 5, RB does not resolve inside this
# range and says so on screen instead of quietly taking the endpoint. Silhouette
# is still computed and still displayed — as a diagnostic beside the gap curve,
# so a disagreement between them is visible rather than resolved in private.
clustering:
  seed: 42
  k_min: 2
  # Also the number of categorical colours the theme provides. A position that
  # wanted more groups than this would be drawing beyond its palette.
  k_max: 8
  # Reference draws for the gap statistic. 20 is where the standard error of the
  # gap stopped moving the chosen k on this data; below ~8 the selection wobbles.
  gap_reference_draws: 20
  gap_sample_rows: 8000
  silhouette_sample_rows: 8000
  # A feature this null in training cannot be imputed into a cluster boundary
  # without inventing one. Above this line the column is dropped and the drop is
  # recorded in the artifact rather than silently zero-filled.
  max_null_rate: 0.05
  # Greedy |Spearman| pruning. Rank correlation because these columns are heavy
  # tailed and Pearson understates how duplicated they are.
  max_abs_corr: 0.90
  # Same reasoning as rank_economics.MIN_BETS: a group this small cannot resolve
  # its own sign, so a k that produces one is rejected before selection runs.
  min_cluster_rows: 50
  # Row cap for the in-app exploratory refit only. The served clustering is
  # always fitted on every eligible row by scripts/20_clusters.py.
  explore_max_rows: 40000
# Market anchoring. Nothing here is a probability — the expected scorer count is
# refit from labels on every training run (src/models/market_prior.py) and the
# blend weight is learned from graded odds history as soon as enough exists
# (src/prediction/blend.py). See docs/DATA_SOURCES.md.
blend:
  enabled: true
  # Used ONLY until odds_history.parquet holds min_history_rows graded
  # player-games. Replaced automatically by the fitted weight thereafter; the
  # prediction output records which one was used in `blend_source`.
  bootstrap_market_weight: 0.5
  min_history_rows: 500
# Bankroll policy — how model probabilities become stakes. These are risk
# preferences, not model constants: they belong to you, not to the data.
betting:
  bankroll: 1000.0
  # Fraction of full Kelly. Full Kelly assumes your probabilities are exact;
  # any overconfidence compounds into ruin, so stake a fraction of it.
  kelly_fraction: 0.25
  # Floors a play must clear. Edge is measured against the DE-VIGGED price.
  min_edge_pp: 2.0
  min_ev_pct: 0.0

# The joint game model: team touchdown rate x within-team player share.
joint:
  # Hold a team's defence/special teams out of the offensive share denominator.
  #
  # `team_lambda` is fitted on OFFENSIVE touchdowns alone — td_counts filters
  # td_team == posteam and contains no DEF/ST rows — but player_shares
  # normalises the DEF/ST pseudo-player into the same denominator, handing it a
  # slice of a rate it cannot contribute to. Measured over four walk-forward
  # folds that published a defence as the game's most likely scorer in 131 of
  # 1,131 games, at a mean probability of 0.908 against an actual rate of 0.153.
  # It also understates every real player on that team by whatever share the
  # defence took.
  #
  # With this on, DEF/ST rows are held out of the denominator and keep the
  # calibrated classifier's own probability, which is what they had before the
  # joint model touched them and is well calibrated (0.106 against 0.103).
  #
  # Gated 2026-08-12 on anytime TD, paired per game against the champion over
  # 1,131 walk-forward games:
  #
  #   xgb   Top-1 50.8% -> 53.4%  (+2.56pp, 3.6 se, p=0.000; 47 games won, 18 lost)
  #         Brier 0.09121 -> 0.09019 (better)
  #         Top-5 94.8% -> 93.3%  (-1.50pp)   AUC 0.8413 -> 0.8320 (-0.0094)
  #   lgbm  Top-1 49.7% -> 51.1%  (+1.41pp, p=0.033), Brier better
  #   ens   Top-1 51.2% -> 51.8%  (not significant)
  #   lr    unchanged — it never ranked a defence highly to begin with
  #
  # Promoted as KEPT_WITH_JUSTIFICATION: Top-1 is the objective, and the Top-5
  # loss is the honest price of no longer covering defences by accident. The old
  # path bought that coverage by publishing a 15%-likely defence as the game's
  # most likely scorer 131 times.
  #
  # Getting Top-5 back means ranking defences properly rather than inflating
  # them: within DEF/ST rows the classifier's AUC is 0.54, barely better than
  # chance. That is the follow-up, not a reason to keep the inflation.
  exclude_defst_from_shares: true

# First-TD-only settings.
first_td:
  # Rank first-TD candidates by a geometric blend of this market's model and the
  # anytime-TD model's. Whoever scores the game's first touchdown scored a
  # touchdown, and the two models have been solving halves of one problem
  # without seeing each other's answer.
  #
  # No weight is set here, and there is not one to set: it is fitted per fold on
  # the validation season by the categorical likelihood — the probability the
  # model placed on the player who actually scored first — and applied to the
  # held-out one. See src/prediction/cross_market.py.
  #
  # Off until `make gate EXP=experiments/first-td-anytime-prior.yaml` says
  # otherwise. The exploratory curve that motivated it was measured on the same
  # seasons it would be applied to, so its peak is optimistic by construction.
  use_anytime_prior: false

  # Derive first-TD probabilities from the joint model instead of normalising
  # the classifier's scores within the game. If both teams' touchdowns arrive as
  # competing Poisson processes then P(team t scores first) = lambda_t /
  # (lambda_home + lambda_away), and the scorer is drawn from that team's
  # shares — the same two pieces anytime TD already uses, with nothing extra to
  # fit. joint.first_td_probability has existed and gone uncalled since the
  # joint model landed.
  #
  # It asserts something the current path cannot: that which *team* scores first
  # is a separate question from which of its players would. It also assumes
  # constant scoring rates through the game, which is wrong in detail — trailing
  # teams throw more. Whether that trade is worth making is what the gate
  # decides.
  use_joint_path: false

# App-only settings. Nothing here reaches the model.
app:
  # Adds a "Model version" control to the sidebar, letting you price a week
  # against any locked version in models/versions/ without promoting it — the
  # way to see what a change actually did to the board before adopting it.
  #
  # A control that silently changes which model produced the board is a good
  # way to read last month's model and believe it is this month's, so the
  # preview is loud rather than subtle: the served version is labelled
  # "(serving)", anything else raises a standing banner, and the banner says
  # that only the board follows the selector — every other tab reads artifacts
  # the pipeline wrote for the served version and does not move.
  #
  # Previewing is read-only by construction. `predict(persist=False)` neither
  # republishes the week's CSV nor lets the blend-weight refit write back into
  # the snapshot, which would edit the very record the manifest's hashes
  # describe. Turn this off if you would rather the control not exist.
  version_selector: true

# ── Weekly odds capture ────────────────────────────────────────────────────
# The Odds API serves markets only for games that have not kicked off, and every
# request spends credits. Both facts make the capture times a scheduling
# problem rather than a constant, so `scripts/25_odds_schedule.py` derives them
# from the season's real kickoffs.
#
# The schedule this replaced fired `close` once, Sunday 12:15. In 2026 that is
# 33 of 272 games — every Thursday, Friday, Saturday and Wednesday game, plus
# the 09:30 London kickoffs — with no closing line obtainable at any price,
# because by Sunday noon the API has already stopped serving them. Closing-line
# value is the only evidence of edge that does not depend on who scored, so a
# game with no closing price is a game that cannot testify.
odds_capture:
  # How long before kickoff to take the closing snapshot. Long enough that a
  # slow fetch still lands before the game starts, short enough to be a
  # closing price rather than a morning price.
  lead_minutes: 30
  # Kickoffs closer together than this share one capture, taken before the
  # earliest of them. Sunday's 16:05 and 16:25 waves do not need separate
  # requests; without merging, each distinct kickoff time would cost its own.
  merge_minutes: 45
  # The opening snapshot: one fixed weekly slot, early enough to precede every
  # kickoff in the season and late enough that books have posted player props.
  open_weekday: Wednesday
  open_time: "12:00"
  # A firing that finds no kickoff inside its window exits before calling the
  # API. Flex scheduling moves games between windows all season, so the
  # generated slots are deliberately generous and this guard — not the plist —
  # is what keeps the generosity from costing credits.
  close_window_hours: 4
  # The same guard for the opening snapshot, in days. Stops the weekly job
  # spending credits on props that no book has posted yet through an entire
  # off-season.
  #
  # Eight, not seven, and the extra day is load-bearing. The opening slot fires
  # Wednesday 12:00; the 2026 season opener kicks off Wednesday 20:20. Any
  # window of exactly seven days therefore falls 8h20m short of the only
  # firing that could take a genuine opening line for week 1:
  #
  #   Wed 2026-09-02 12:00   next kickoff 7d8h away   7-day window -> SKIP
  #   Wed 2026-09-09 12:00   next kickoff 8h20m away  7-day window -> capture
  #
  # So a seven-day window does not merely delay the first snapshot, it converts
  # it into a second closing price taken eight hours before the season starts,
  # and week 1 never gets an opening line at all.
  #
  # This bites only when the opener falls on the same weekday as the slot, at
  # or after 12:00. A Thursday opener is 1d8h from the Wednesday before it and
  # captures under any window; a Wednesday opener is 7d8h from the Wednesday
  # before it and captures under none below eight days. Once the season is
  # running the guard is inert — the next kickoff is never more than a week
  # away — so this setting governs the season boundary and long gaps, which is
  # exactly where the opening line is scarcest.
  #
  # The cost of the extra day is at most one credit per week, in the stretch
  # where the next kickoff sits between seven and eight days out. The cost of
  # the missing day is a price that cannot be bought back, which is the
  # asymmetry src/ingest/capture_window.py is built around.
  open_window_days: 8

paths:
  raw: data/raw
  processed: data/processed
  models: models
  output: output
  plots: output/plots
ai_context:
  enabled: true
  max_adjustment: 0.1
positions:
  offensive:
  - QB
  - RB
  - WR
  - TE
  - FB
